<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: pink;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            color: red;
        }
        .flex-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            flex-wrap: wrap;
        }
        .image-box {
            flex: 1;
            min-width: 280px;
            border: 5px solid blue;
            box-shadow: 0 4px 8px (0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h1>Assignment 3</h1>
    <div class="flex-container">
        <div class="image-box">
            <img src="images/one.png" alt="Image One">
        </div>
        <div class="image-box">
            <img src="images/two.png" alt="Image Two">
        </div>
    </div>
</body>
</html>
